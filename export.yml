version: 1
project:
  exports:
    - format: pdf
      template: https://github.com/TUD-JB-OS/latex_template.git
      output: exports/report_tex.pdf
      id: report_tex
      articles:
        - content/Index.md
        - content/Introduction.md
        - content/Static.md
        - content/BucklingPlates.md
        - content/BucklingShells.md
        - content/PostBuckling.md
        - content/PostBucklingShells.md
    
    - format: typst
      template: https://github.com/TUD-JB-OS/typst_template.git
      output: exports/report_typst.pdf
      id: report_typst
    
    - format: docx
      article: templates/template_docx.md
      output: exports/report.docx
      id: report_docx

  downloads:
    - id: report_tex
      title: PDF (LaTeX)
    - id: report_typst
      title: PDF (Typst)
    - id: report_docx
      title: DOCX (Microsoft Word)