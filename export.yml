version: 1
project:
  exports:
    - format: pdf
      template: https://github.com/TUD-JB-OS/latex_template.git
      output: exports/report_tex.pdf
      id: report_tex
    
    - format: typst
      template: https://github.com/TUD-JB-OS/typst_template.git
      output: exports/report_typst.pdf
      id: report_typst
    
    - format: docx
      output: exports/report.docx
      id: report_docx
      chapters:
        - content/Index.md
        - content/Introduction.md
        - content/PostBuckling.md
        - content/Results.ipynb
        - content/Conclusion.md
        - content/Cheatsheet.md


  downloads:
    - id: report_tex
      title: PDF (LaTeX)
    - id: report_typst
      title: PDF (Typst)
    - id: report_docx
      title: DOCX (Microsoft Word)