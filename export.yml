version: 1
project:
  exports:
    - format: pdf
      template: templates/latex_template
      output: exports/report_tex.pdf
      id: report_tex
      articles:
        - content/Index.md
        - content/Introduction.md
        - content/Static.md
        - content/BucklingPlates.md
        - content/BucklingShells.md
        - content/PostBuckling.md
        - content/PostBucklingShells.md
        - content/PostBucklingShells-Imperfect.md
        - content/KinematicEquations.md
        
    - format: typst
      template: templates/latex_template
      output: exports/report_typst.pdf
      id: report_typst
    
    - format: docx
      article: templates/template_docx.md
      output: exports/report.docx
      id: report_docx
    
    - format: tex
      output: exports/report.tex
      id: report_pandoc
      articles:
        - content/Index.md
        - content/Introduction.md
        - content/Static.md
        - content/BucklingPlates.md
        - content/PostBuckling.md
        - content/PostBuckling-be-composites-TEW.ipynb
        - content/PostBucklingShells.md
        - content/PostBucklingShells-Imperfect.md
        - content/KinematicEquations.md

  downloads:
    - id: report_tex
      title: PDF (LaTeX)
    - id: report_typst
      title: PDF (Typst)
    - id: report_docx
      title: DOCX (Microsoft Word)
    - id: report_pandoc
      title: DOCX (Pandoc)