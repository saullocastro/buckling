version: 1
project:
  title: Buckling handbook
  keywords: [Buckling, Post-Buckling, Semi-Analytical, Jupyter Book, Open Science, TU Delft]
  authors: 
    - name: Saullo G. P. Castro
      affiliation: Delft University of Technology
  github: https://github.com/saullocastro/buckling
  date: 2026-03-25

  numbering:
    code: false
    equations: false
    headings: true

  # used to load /reuse materials from other repositories
  references:
    myst-guide: https://mystmd.org/guide
    JB-workshop: https://jupyter-book.github.io/workshop-template/
    
  bibliography:
    - references.bib

  jupyter:
    binder:
      repo: https://github.com/executablebooks/thebe-binder-base
  
extends:
  - toc.yml     # includes table of contents
  - export.yml  # includes export configurations
  - plugins.yml

site:
  template: book-theme
  options:
    analytics_google: G-RFTJ1MWS5P
    style: custom.css
    favicon: figures/favicon.ico
    hide_authors: true
  actions:
    - title: PDF
      url: ./exports/report_tex.pdf
    - title: DOCX pandoc
      url: ./exports/report_pandoc.docx
#    - title: Typst PDF
#      url: ./exports/report_typst.pdf
#    - title: DOCX
#      url: ./exports/report.docx
